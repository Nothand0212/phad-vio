name = "vio_researcher"
description = "只读研究 GTSAM 与成熟 VIO/SLAM 实现，为新传感器、factor、初始化、优化或重大设计决策提供一手资料对照。"
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
